<style>
  /* ============================================================
     THE CHARLESTON ATELIER — PATIENT PORTAL
     Palette lifted from the approved mockup.
     ============================================================ */
  :root {
    --bg:            #F3EBE1;   /* warm ivory page */
    --card:          #F8F2EA;   /* button face */
    --card-hover:    #FBF6F0;
    --espresso:      #3B2E20;   /* patient name */
    --espresso-soft: #4A3B2C;   /* greeting + button labels */
    --brass:         #8A7350;   /* monogram, chevrons, nav icons */
    --brass-soft:    #A38C69;
    --hairline:      rgba(138, 115, 80, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--espresso-soft);
    font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .portal {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 46px 24px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }

  /* ---------- Monogram ---------- */
  .monogram {
    text-align: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
    font-size: 66px;
    line-height: 1;
    color: var(--brass);
    margin-bottom: 30px;
    user-select: none;
  }
  .monogram .c { position: relative; top: -0.06em; }
  .monogram .a { margin-left: -0.32em; }

  /* ---------- Greeting ---------- */
  .greeting {
    text-align: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
    font-size: 31px;
    line-height: 1.1;
    color: var(--espresso-soft);
    letter-spacing: 0.005em;
  }

  .patient-name {
    text-align: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 56px;
    line-height: 1.15;
    letter-spacing: 0.1em;
    text-indent: 0.1em;          /* optically re-centre the tracked caps */
    color: var(--espresso);
    text-transform: uppercase;
    margin-top: 6px;
    margin-bottom: 40px;
    white-space: nowrap;
  }

  /* ---------- Buttons ---------- */
  .menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .menu-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 78px;
    padding: 18px 46px;
    background: var(--card);
    border: none;
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(59, 46, 32, 0.05),
                0 6px 18px rgba(59, 46, 32, 0.045);
    font-family: 'Jost', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.085em;
    text-transform: uppercase;
    color: var(--espresso-soft);
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .menu-item:hover,
  .menu-item:focus-visible {
    background: var(--card-hover);
    box-shadow: 0 2px 4px rgba(59, 46, 32, 0.06),
                0 10px 24px rgba(59, 46, 32, 0.07);
    outline: none;
  }
  .menu-item:focus-visible { box-shadow: 0 0 0 2px var(--brass-soft); }
  .menu-item:active { transform: scale(0.988); }

  .menu-item .chevron {
    position: absolute;
    right: 26px;
    top: 50%;
    transform: translateY(-50%);
    width: 11px;
    height: 19px;
    color: var(--brass);
    flex: none;
  }

  /* Buttons with no file/link attached yet still look identical —
     they simply announce that the item is being prepared. */
  .menu-item[data-empty="true"] { cursor: default; }

  /* ---------- Bottom navigation ---------- */
  .nav {
    margin-top: auto;
    padding-top: 46px;
    display: flex;
    align-items: center;
    justify-content: space-around;
  }

  .nav a, .nav button {
    background: none;
    border: none;
    padding: 10px 14px;
    color: var(--brass);
    cursor: pointer;
    display: inline-flex;
    line-height: 0;
    border-radius: 12px;
    transition: color 0.2s ease, transform 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .nav a:hover, .nav button:hover,
  .nav a:focus-visible, .nav button:focus-visible {
    color: var(--espresso);
    transform: translateY(-1px);
    outline: none;
  }
  .nav svg { width: 25px; height: 25px; }

  /* ---------- Toast (shown for buttons with nothing attached yet) ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(92px + env(safe-area-inset-bottom));
    transform: translate(-50%, 14px);
    max-width: min(360px, calc(100vw - 40px));
    padding: 13px 20px;
    background: var(--espresso);
    color: #F6F0E7;
    border-radius: 14px;
    font-size: 13.5px;
    letter-spacing: 0.02em;
    text-align: center;
    box-shadow: 0 12px 30px rgba(59, 46, 32, 0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s ease;
    z-index: 50;
  }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Small screens ---------- */
  @media (max-width: 360px) {
    .portal { padding: 36px 18px calc(16px + env(safe-area-inset-bottom)); }
    .patient-name { font-size: 42px; }
    .greeting { font-size: 27px; }
    .menu-item { font-size: 14.5px; min-height: 70px; padding: 16px 40px; }
    .monogram { font-size: 50px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<main class="portal">

  <div class="monogram" role="img" aria-label="The Charleston Atelier">
    <span class="c">C</span><span class="a">A</span>

  <h1 class="patient-name" id="patientName">Jessica</h1>

  <nav class="menu" id="menu" aria-label="Patient portal"></nav>

</main>

<script>
/* ================================================================
   ✦ EDIT EVERYTHING HERE ✦
   ----------------------------------------------------------------
   This is the only block you need to touch. Each button below is
   live on the site right now; give it a `href` whenever the file or
   link is ready and it starts working immediately.

   HOW TO ATTACH A FILE (e.g. Jessica's dosing instructions):
     1. Drop the PDF into the `files/` folder next to this page,
        e.g.  files/jessica-dosing-instructions.pdf
     2. Set the button's href to that path:
          href: "files/jessica-dosing-instructions.pdf"
     3. Commit + redeploy. Done.

   HOW TO ATTACH A LINK:
        href: "https://calendly.com/your-booking-link"
     External links (http…) open in a new tab automatically.

   A button with an empty href stays on the page and shows a quiet
   "being prepared" note when tapped — nothing ever looks broken.
   ================================================================ */

const PORTAL = {

  patientName: "Jessica",
  greeting:    "Welcome Back,",

  // Message shown when a button has no href yet.
  pendingNote: "Your concierge is preparing this — check back shortly.",

  buttons: [
    {
      id:    "ritual",
      label: "Today’s Ritual",
      href:  ""     // e.g. "files/jessica-daily-ritual.pdf"
    },
    {
      id:    "protocol",
      label: "My Protocol",
      href:  ""     // ← DOSING INSTRUCTIONS GO HERE
                    //   e.g. "files/jessica-dosing-instructions.pdf"
    },
    {
      id:    "concierge",
      label: "Book Concierge",
      href:  ""     // e.g. "https://calendly.com/..." or "sms:8433773713"
    },
    {
      id:    "shop",
      label: "Shop Peptides",
      href:  ""     // e.g. "https://your-store.com/jessica"
    },
    {
      id:    "dashboard",
      label: "Dashboard",
      href:  ""     // e.g. "https://your-dashboard-link"
    }
  ],

  // Bottom icon row. `linkTo` points at one of the button ids above,
  // so it inherits that button's href — set the href once, both work.
  // Or give a nav item its own `href` to override.
  bottomNav: [
    { icon: "home",      label: "Home",      href: "./" },
    { icon: "bag",       label: "Shop",      linkTo: "shop" },
    { icon: "clipboard", label: "Protocol",  linkTo: "protocol" },
    { icon: "concierge", label: "Concierge", linkTo: "concierge" }
  ]
};

/* ================================================================
   Rendering — no need to edit below this line.
   ================================================================ */

const ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.2 12 3.6l8.5 6.6V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/></svg>',
  bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.5h15l-1 13.5h-13z"/><path d="M8.75 9.5V6.6a3.25 3.25 0 0 1 6.5 0v2.9"/></svg>',
  clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 4.5H6.6a1.6 1.6 0 0 0-1.6 1.6v13.3a1.6 1.6 0 0 0 1.6 1.6h10.8a1.6 1.6 0 0 0 1.6-1.6V6.1a1.6 1.6 0 0 0-1.6-1.6H15.5"/><rect x="8.5" y="2.6" width="7" height="3.8" rx="1.1"/><path d="m9.4 13.4 1.9 1.9 3.5-3.7"/></svg>',
  concierge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 17.6a7.8 7.8 0 0 1 15.6 0z"/><path d="M2.9 20.6h18.2"/><path d="M12 6.6v3.2"/><circle cx="12" cy="5.2" r="1.4"/></svg>'
};

const CHEVRON = '<svg class="chevron" viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.4 1.4 8 8.1-8 8.1"/></svg>';

const isExternal = (href) => /^(https?:|mailto:|tel:|sms:)/i.test(href);

function renderName() {
  document.title = PORTAL.patientName + " — Patient Portal";
  document.querySelector(".greeting").textContent = PORTAL.greeting;
  document.getElementById("patientName").textContent = PORTAL.patientName;
}

function renderButtons() {
  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  PORTAL.buttons.forEach(item => {
    const href = (item.href || "").trim();
    const el = document.createElement(href ? "a" : "button");

    el.className = "menu-item";
    el.dataset.id = item.id;
    el.innerHTML = '<span>' + item.label + '</span>' + CHEVRON;

    if (href) {
      el.href = href;
      if (isExternal(href) || /\.(pdf|jpe?g|png|heic)$/i.test(href)) {
        el.target = "_blank";
        el.rel = "noopener noreferrer";
      }
    } else {
      el.type = "button";
      el.dataset.empty = "true";
      el.addEventListener("click", () => showToast(PORTAL.pendingNote));
    }

    menu.appendChild(el);
  });
}

function renderNav() {
  const nav = document.getElementById("bottomNav");
  nav.innerHTML = "";

  PORTAL.bottomNav.forEach(item => {
    let href = (item.href || "").trim();
    if (!href && item.linkTo) {
      const target = PORTAL.buttons.find(b => b.id === item.linkTo);
      href = target ? (target.href || "").trim() : "";
    }

    const el = document.createElement(href ? "a" : "button");
    el.innerHTML = ICONS[item.icon] || "";
    el.setAttribute("aria-label", item.label);
    el.title = item.label;

    if (href) {
      el.href = href;
      if (isExternal(href) || /\.(pdf|jpe?g|png|heic)$/i.test(href)) {
        el.target = "_blank";
        el.rel = "noopener noreferrer";
      }
    } else {
      el.type = "button";
      el.addEventListener("click", () => showToast(PORTAL.pendingNote));
    }

    nav.appendChild(el);
  });
}

let toastTimer;
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("visible"), 2600);
}

renderName();
renderButtons();
renderNav();
</script>

</body>
</html>

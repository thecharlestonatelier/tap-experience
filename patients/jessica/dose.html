<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3EBE1">
<meta name="robots" content="noindex, nofollow">
<!-- Served at /v/<vial>, so every relative URL needs the site root. -->
<base href="/">
<title>Log this dose</title>
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/fonts.css">
<script src="assets/protocol.js"></script>
<style>
  :root {
    --bg:#F3EBE1; --card:#F8F2EA; --espresso:#3B2E20; --espresso-soft:#4A3B2C;
    --brass:#8A7350; --muted:#8A7C6A; --hairline:rgba(138,115,80,.18);
    --alert:#A4553F; --ok:#5C7A5E;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    background:var(--bg); color:var(--espresso-soft);
    font-family:'Jost',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100dvh; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
  }
  .wrap { width:100%; max-width:430px; padding:calc(20px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom)); }

  .mark { display:block; height:52px; width:auto; margin:0 auto 22px; }
  .eyebrow { font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
             color:var(--brass); text-align:center; margin-bottom:8px; }
  h1 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500;
       font-size:34px; line-height:1.1; color:var(--espresso);
       text-align:center; margin-bottom:6px; }
  .lede { font-size:13.5px; line-height:1.55; color:var(--muted);
          text-align:center; margin-bottom:22px; }

  .card { background:var(--card); border-radius:18px; padding:22px;
          box-shadow:0 1px 2px rgba(59,46,32,.05), 0 8px 22px rgba(59,46,32,.05); }

  /* One line under the question, so she can see it is her card and what
     the pen should be turned to without reading a form. */
  .line { text-align:center; font-size:13px; color:var(--muted); }
  .line b { font-family:'Cormorant Garamond',Georgia,serif; font-size:19px;
            font-weight:500; color:var(--espresso); }

  .act { display:block; width:100%; margin-top:20px; padding:16px;
         border:0; border-radius:999px; background:var(--espresso); color:#F6F0E7;
         font-family:'Jost',sans-serif; font-size:13.5px; font-weight:600;
         letter-spacing:.09em; text-transform:uppercase; cursor:pointer;
         -webkit-tap-highlight-color:transparent; }
  .act:disabled { opacity:.5; }
  .ghost { display:block; width:100%; margin-top:10px; padding:13px;
           background:none; border:1px solid var(--hairline); border-radius:999px;
           color:var(--brass); font-family:'Jost',sans-serif; font-size:12.5px;
           letter-spacing:.07em; text-transform:uppercase; text-align:center;
           text-decoration:none; cursor:pointer; }

  .note { margin-top:18px; font-size:11.5px; line-height:1.6; color:var(--muted); text-align:center; }
  .bad { color:var(--alert); }
  .done { text-align:center; }
  .done .tick { width:54px; height:54px; margin:0 auto 14px; display:block; color:var(--ok); }
  .done h2 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500;
             font-size:28px; color:var(--espresso); margin-bottom:6px; }
</style>
</head>
<body>
<div class="wrap">
  <img class="mark" src="assets/icons/monogram.png" alt="The Charleston Atelier">
  <div id="view">
    <p class="lede" id="boot">Reading the label…</p>
  </div>
</div>

<script>
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

/* The label carries "<template>.<lot>" — the pen and the vial it came
   from. Never a patient: one printed label is valid for whoever is
   holding it, and a label naming someone would be PHI sitting on a bench. */
function readVial() {
  const raw = String(window.__VIAL__ || '');
  const dot = raw.indexOf('.');
  return dot === -1
    ? { template: raw, lot: '' }
    : { template: raw.slice(0, dot), lot: raw.slice(dot + 1) };
}

const V = readVial();
const view = document.getElementById('view');

let HOME = '/';   // her card, once we know which one it is

function stop(title, why, showOpen) {
  view.innerHTML = `<h1>${esc(title)}</h1><p class="lede">${esc(why)}</p>` +
    (showOpen ? `<a class="ghost" href="${esc(HOME)}">Open my card</a>` : '');
}

(async function boot() {
  let templates;
  try { templates = await loadTemplates(); }
  catch { return stop('Not right now', 'This page could not load. Try again in a moment.'); }

  const t = (templates.templates || []).find(x => x.id === V.template);
  if (!t) return stop('Unknown label', 'This vial is not one the atelier recognises. Please message us before injecting.');

  // Identity comes from the card this phone has already opened. Without
  // it there is nobody to log against, and guessing is not an option.
  const mem = recallCard();
  const slug = (mem && mem.slug) || null;
  if (slug) HOME = '/' + slug;
  if (!slug) {
    return stop('Open your card first',
      'Tap your Atelier card, then tap this vial again. The label knows the vial, not who is holding it.', true);
  }

  let CFGX;
  try {
    const res = await fetch(`/api/card/${encodeURIComponent(slug)}`, { cache:'no-store' });
    if (!res.ok) throw new Error('gone');
    CFGX = hydrateRecord(await res.json(), templates);
  } catch {
    return stop('Could not reach your card', 'Please try again, or message the atelier.', true);
  }

  // The dose is whatever her own protocol says for this pen today — not
  // a number typed on a label.
  CFG = CFGX;
  PENS = CFG.protocol.pens || [];
  START = parse(loadStart() || CFG.protocol.startDate);
  applySetups();

  const pen = PENS.find(x => x.template === t.id || x.id === t.id);
  if (!pen) {
    return stop('Not on your card',
      `${t.name} is not part of your protocol. Please message the atelier before injecting.`, true);
  }

  const when = today();
  const day = iso(when);
  const dose = doseOn(pen, when);
  if (!dose) {
    return stop('Not scheduled today',
      `Today is a rest day for ${t.name}. Message the atelier if you think that is wrong.`, true);
  }

  /* The green square, once it is green. Shown after a yes, and also on a
     second tap, so the answer to "did that go through?" is the same
     screen either way. */
  function logged(already) {
    view.innerHTML = `<div class="done">
      <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>
      <h2>${already ? 'Already logged' : 'Logged'}</h2>
      <p class="lede">${esc(pen.name)}, ${dose.units} units — today is marked.</p>
      <a class="ghost" href="calendar.html?c=${encodeURIComponent(slug)}">See my calendar</a>
      <a class="ghost" href="${esc(HOME)}">Back to my card</a>
    </div>`;
  }

  // Already green? Say so before asking a question she has answered.
  try {
    const res = await fetch(`/api/logged/${encodeURIComponent(slug)}`, { cache: 'no-store' });
    if (res.ok) {
      const { days } = await res.json();
      if ((days[day] || []).includes(t.id)) return logged(true);
    }
  } catch { /* the question still stands without it */ }

  // One question, two answers. Everything needed to answer it is on the
  // line underneath: whose card this is, and what to turn the pen to.
  view.innerHTML = `
    <h1>Log today's dose of ${esc(pen.name)}?</h1>
    <div class="card">
      <p class="line">${esc(CFG.patient.name)} · <b>${dose.units}</b> units · ${round(dose.totalMg, 2)} mg</p>
      <button class="act" id="go">Yes</button>
      <a class="ghost" href="${esc(HOME)}">No</a>
    </div>
    <p class="note">Nothing is recorded until you answer.</p>`;

  document.getElementById('go').addEventListener('click', async e => {
    const btn = e.currentTarget;
    btn.disabled = true; btn.textContent = 'One moment…';
    try {
      const res = await fetch('/api/dose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          slug, template: t.id, lot: V.lot, pen: pen.name, frequency: freqText(pen),
          units: dose.units, mg: round(dose.totalMg, 3),
          at: new Date().toISOString(), day
        })
      });
      if (!res.ok) throw new Error('refused');
      logged((await res.json()).duplicate);
    } catch {
      btn.disabled = false; btn.textContent = 'Try again';
      const p = document.createElement('p');
      p.className = 'note bad';
      p.textContent = 'That did not reach the atelier. Your dose still counts — try again, or tell us at your next visit.';
      btn.parentElement.appendChild(p);
    }
  });
})();
</script>
</body>
</html>

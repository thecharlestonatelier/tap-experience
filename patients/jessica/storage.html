<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3EBE1">
<meta name="robots" content="noindex, nofollow">
<title>Storage &amp; Use</title>
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier">
<link rel="stylesheet" href="assets/fonts.css">
<script src="assets/protocol.js"></script>
<style>
  :root {
    --bg:#F3EBE1; --card:#F8F2EA; --espresso:#3B2E20; --espresso-soft:#4A3B2C;
    --brass:#8A7350; --muted:#8A7C6A; --hairline:rgba(138,115,80,.18);
    --alert:#A4553F; --cold:#5A7387;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    background:var(--bg); color:var(--espresso-soft);
    font-family:'Jost',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100dvh; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:430px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom)); }

  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .back {
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:50%; background:var(--card);
    box-shadow:0 1px 3px rgba(59,46,32,.12); color:var(--brass);
    text-decoration:none; flex:none;
  }
  .back svg { width:15px; height:15px; }
  .eyebrow { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }

  h1 {
    font-family:'Cormorant Garamond',Georgia,serif; font-weight:500;
    font-size:38px; line-height:1.1; color:var(--espresso); margin-bottom:8px;
  }
  .lede { font-size:14px; line-height:1.6; color:var(--muted); margin-bottom:26px; }

  .block { background:var(--card); border-radius:16px; padding:20px; margin-bottom:16px;
           box-shadow:0 1px 2px rgba(59,46,32,.05), 0 6px 18px rgba(59,46,32,.045); }
  .block h2 {
    font-family:'Cormorant Garamond',Georgia,serif; font-weight:600;
    font-size:24px; color:var(--espresso); margin-bottom:4px;
  }
  .block .sub { font-size:12px; color:var(--muted); margin-bottom:14px; }

  .body { font-size:13.5px; line-height:1.55; }
  ul { list-style:none; }
  ul li { position:relative; padding-left:16px; font-size:13.5px; line-height:1.55; margin-bottom:8px; }
  ul li::before { content:'·'; position:absolute; left:4px; color:var(--brass); font-weight:700; }
  ul li:last-child { margin-bottom:0; }

  /* Where each pen lives */
  .where { display:grid; gap:11px; }
  .where .row {
    display:grid; grid-template-columns:auto 1fr; gap:11px; align-items:start;
    padding-bottom:11px; border-bottom:1px solid var(--hairline);
  }
  .where .row:last-child { border-bottom:0; padding-bottom:0; }
  .pill {
    font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600;
    padding:4px 9px; border-radius:999px; white-space:nowrap; margin-top:2px;
  }
  .pill.fridge { background:rgba(90,115,135,.13); color:var(--cold); }
  .pill.freezer { background:rgba(90,115,135,.22); color:var(--cold); }
  .where .name { font-size:14px; font-weight:500; color:var(--espresso); }
  .where .how { font-size:12.5px; line-height:1.5; color:var(--muted); margin-top:2px; }

  /* Numbered steps */
  ol.steps { list-style:none; counter-reset:s; }
  ol.steps li {
    counter-increment:s; position:relative; padding-left:30px;
    font-size:13.5px; line-height:1.55; margin-bottom:10px;
  }
  ol.steps li:last-child { margin-bottom:0; }
  ol.steps li::before {
    content:counter(s); position:absolute; left:0; top:1px;
    width:20px; height:20px; border-radius:50%;
    background:rgba(138,115,80,.13); color:var(--brass);
    font-size:11px; font-weight:600; display:flex;
    align-items:center; justify-content:center;
  }
  .steps-note { margin-top:12px; font-size:12.5px; line-height:1.5; color:var(--muted);
                padding-left:11px; border-left:2px solid var(--hairline); }

  .lab { font-size:10px; letter-spacing:.15em; text-transform:uppercase;
         color:var(--brass); margin:18px 0 8px; }
  .lab:first-of-type { margin-top:0; }

  .call {
    margin-top:26px; padding:20px; border-radius:16px;
    background:rgba(164,85,63,.06); border:1px solid rgba(164,85,63,.22);
  }
  .call h2 { font-family:'Cormorant Garamond',Georgia,serif; font-size:23px;
             color:var(--alert); margin-bottom:8px; font-weight:600; }
  .call .body { color:var(--espresso-soft); }
  .call a.act {
    display:block; text-align:center; margin-top:14px; padding:13px;
    border-radius:999px; background:var(--espresso); color:#F6F0E7;
    text-decoration:none; font-size:13px; font-weight:600;
    letter-spacing:.07em; text-transform:uppercase;
  }
  .foot { margin-top:26px; font-size:11.5px; line-height:1.6; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="./" aria-label="Back to portal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="eyebrow">Storage &amp; Use</span>
  </div>

  <h1>Storage &amp; Use</h1>
  <p class="lede" id="lede">Loading your protocol…</p>

  <div id="blocks"></div>

  <div class="call">
    <h2>If something looks wrong</h2>
    <div class="body"><ul id="wrong"></ul></div>
    <a class="act" id="msg" href="#">Message Dr. Kendall</a>
  </div>

  <p class="foot">
    This page reflects what is on your card today. If the atelier changes your
    protocol, it changes here too.
  </p>
</div>

<script>
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
const li  = a => a.map(s => `<li>${esc(s)}</li>`).join('');
const num = a => a.map(s => `<li>${esc(s)}</li>`).join('');

/* Fridge or freezer comes from the pen's own `store` field, never from
   reading its prose — "Do not freeze" contains the word freeze, and a
   regex over English put every pen in the freezer. */
function place(pen) {
  return pen.store === 'freezer' ? 'freezer' : 'fridge';
}

(async function boot() {
  try {
    await loadProtocol();
  } catch {
    document.getElementById('lede').textContent =
      'Could not load your protocol. Please contact the atelier.';
    applyCardLinks(document);
    return;
  }

  const PENS = CFG.protocol.pens || [];
  const H = CFG.protocol.handling || {};
  document.title = `Storage & Use — ${CFG.patient.name}`;
  document.getElementById('lede').textContent = PENS.length
    ? 'Where each of these lives, how to give it, and how to travel with it.'
    : 'There is nothing on this card yet.';

  const out = [];

  // ---- Where each one lives -------------------------------------------
  if (PENS.length) {
    out.push(`<div class="block">
      <h2>Where each one lives</h2>
      <div class="sub">Straight back in after every dose — not left on the counter.</div>
      <div class="where">${PENS.map(pen => `
        <div class="row">
          <span class="pill ${place(pen)}">${place(pen)}</span>
          <div>
            <div class="name">${esc(pen.name)}</div>
            <div class="how">${esc(pen.storage || '')}</div>
          </div>
        </div>`).join('')}
      </div>
      <div class="steps-note">Refrigerated at all times — it is what preserves the
        potency. Keep them out of the light and away from heat, and away from the
        back wall of the fridge, where things freeze. A pen that has frozen is
        finished, even once it thaws.</div>
    </div>`);
  }

  // ---- Priming ---------------------------------------------------------
  // Dial pens only. A drawn-up vial has nothing to prime, and showing the
  // step to someone holding a syringe would just be confusing.
  if (H.priming && PENS.some(p => !isSyringe(p))) {
    out.push(`<div class="block">
      <h2>Before the first dose</h2>
      <div class="sub">Priming a new pen</div>
      <div class="body">${esc(H.priming.why)}</div>
      <div class="lab">Steps to prime</div>
      <ol class="steps">${num(H.priming.steps)}</ol>
      <div class="steps-note"><strong>${esc(H.priming.check)}</strong></div>
      <div class="steps-note">${esc(H.priming.once)}</div>
    </div>`);
  }

  // ---- Giving it -------------------------------------------------------
  // A card can hold both a dial pen and a draw-up vial. Show only the
  // steps that apply to what she actually has.
  const hasPen  = PENS.some(p => !isSyringe(p));
  const hasVial = PENS.some(p =>  isSyringe(p));
  const steps = [];
  if (hasPen && CFG.protocol.injectionSteps) {
    steps.push(`<div class="lab">With a pen</div>
      <ol class="steps">${num(CFG.protocol.injectionSteps.map(
        s => s.replace('{units}', 'your number')))}</ol>`);
  }
  if (hasVial && CFG.protocol.injectionStepsVial) {
    steps.push(`<div class="lab">Drawing from a vial</div>
      <ol class="steps">${num(CFG.protocol.injectionStepsVial.map(
        s => s.replace('{units}', 'your number')))}</ol>`);
  }
  if (steps.length) {
    out.push(`<div class="block">
      <h2>Giving it</h2>
      <div class="sub">Today's Ritual has your exact number for the day.</div>
      ${steps.join('')}
      ${(CFG.protocol.sites || []).length ? `<div class="lab">Rotating sites</div>
        <div class="body">Move to the next site each time rather than going back to
        a favourite: ${esc(CFG.protocol.sites.join(', '))}. Keep two inches clear of
        your navel.</div>` : ''}
    </div>`);
  }

  // ---- Needles, sharps, travel ----------------------------------------
  if (H.needles || H.sharps) {
    out.push(`<div class="block">
      <h2>Pen tips and handling</h2>
      ${H.needles ? `<ul>${li(H.needles)}</ul>` : ''}
      ${H.sharps ? `<div class="lab">Throwing them away</div><ul>${li(H.sharps)}</ul>` : ''}
    </div>`);
  }
  if (H.travel) {
    out.push(`<div class="block">
      <h2>Travelling with it</h2>
      <ul>${li(H.travel)}</ul>
    </div>`);
  }

  document.getElementById('blocks').innerHTML = out.join('');
  document.getElementById('wrong').innerHTML = li(H.wrong || []);

  document.getElementById('msg').href = smsHref
    ? smsHref()
    : `sms:${(CFG.protocol.concierge && CFG.protocol.concierge.phone) || '843-377-3713'}`;

  applyCardLinks(document);
})();

/* The same message link the rest of the portal uses. */
function smsHref() {
  const c = (CFG && CFG.protocol && CFG.protocol.concierge) || {};
  const phone = (c.phone || '843-377-3713').replace(/[^\d+]/g, '');
  const opener = encodeURIComponent(c.messageOpener || 'Hi Dr. Phelps-Polirer — ');
  return `sms:${phone}${/iP(hone|ad|od)/.test(navigator.userAgent) ? '&' : '?'}body=${opener}`;
}
</script>
</body>
</html>
